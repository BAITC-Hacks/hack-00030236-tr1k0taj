name: voice-router

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice_router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_router}
      POSTGRES_DB: ${POSTGRES_DB:-voice_router}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice_router}:${POSTGRES_PASSWORD:-voice_router}@db:5432/${POSTGRES_DB:-voice_router}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_MODE: ${MOCK_MODE:-true}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      # трассировка (ADR 0013): пусто — span'ы только в памяти процесса для GET /traces
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-voice-router-backend}
      TRACE_EXPORT_CONTENT: ${TRACE_EXPORT_CONTENT:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
